[pytest]
# Where to search for the tests
testpaths = tests step_defs
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options (verbose and HTML report)
addopts = -v --html=report.html --self-contained-html

# Custom markers to separate layers
markers =
    api: API and contract testing
    sit: System integration testing (SIT)
    ui: User interface (UI) testing (E2E)